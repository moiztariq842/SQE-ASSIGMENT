[pytest]
# Our own config on purpose: it overrides the repo's pyproject.toml
# (which forces --doctest-modules over the whole repo).
pythonpath = ..
testpaths = tests
addopts = -ra --strict-markers --durations=5
xfail_strict = true
markers =
    stack: tests for data_structures/stacks/stack.py
    queue: tests for data_structures/queues/circular_queue.py
    prime: tests for maths/prime_check.py
    person_a: tests written by 24F-3042
    person_b: tests written by 24F-3084
    24F_3042: tests written by 24F-3042
    24F_3084: tests written by 24F-3084
    smoke: fast sanity checks (run first)
    ecp: equivalence class partitioning tests
    bva: boundary value analysis tests
    negative: invalid input / error handling tests
    scenario: class-level multi-step tests
    csv_driven: data-driven tests that read data/*.csv
    case_order(n): order of a test inside its group (1-99, default 50)
